name: Build Secret Stories Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==================================================================
  # 1. WINDOWS EXECUTABLE (.exe)
  # ==================================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar para Windows
        run: |
          flet build windows --product "Secret Stories" --icon "assets/logo.jpeg" --yes --no-rich-output

      - name: Subir artefacto Windows (.exe)
        uses: actions/upload-artifact@v5
        with:
          name: Secret-Stories-Windows-exe
          path: build/windows/

  # ==================================================================
  # 2. LINUX PACKAGES (.deb & .AppImage)
  # ==================================================================
  build-linux:
    name: Build Linux (.deb & .AppImage)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Instalar dependencias de compilación GTK/Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar binario de Linux
        run: |
          flet build linux --product "Secret Stories" --icon "assets/logo.jpeg" --yes --no-rich-output

      - name: Generar paquete .deb y .AppImage
        run: |
          BIN_PATH=$(find build/linux -type f -executable ! -name "*.so" | head -n 1)
          BIN_NAME=$(basename "$BIN_PATH")

          # Paquete .deb
          mkdir -p deb_package/usr/bin deb_package/usr/share/secret-stories deb_package/DEBIAN
          cp -r build/linux/* deb_package/usr/share/secret-stories/
          ln -s "/usr/share/secret-stories/$BIN_NAME" deb_package/usr/bin/secret-stories
          cat <<EOT > deb_package/DEBIAN/control
          Package: secret-stories
          Version: 1.0.0
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: mikicolmena
          Description: Secret Stories - Juego de misterio y acertijos
          EOT
          dpkg-deb --build deb_package Secret-Stories.deb

          # Paquete .AppImage
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p AppDir/usr/bin
          cp -r build/linux/* AppDir/usr/bin/
          cat <<EOT > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/$BIN_NAME" "\$@"
          EOT
          chmod +x AppDir/AppRun
          cat <<EOT > AppDir/Secret-Stories.desktop
          [Desktop Entry]
          Name=Secret Stories
          Exec=$BIN_NAME
          Icon=secret-stories
          Type=Application
          Categories=Game;
          EOT
          
          if [ -f "assets/logo.jpeg" ]; then
            cp assets/logo.jpeg AppDir/secret-stories.jpeg
            ln -s secret-stories.jpeg AppDir/.DirIcon
          else
            touch AppDir/secret-stories.png
          fi

          ./appimagetool.AppImage AppDir Secret-Stories.AppImage

      - name: Subir artefactos Linux (.deb & .AppImage)
        uses: actions/upload-artifact@v5
        with:
          name: Secret-Stories-Linux-Packages
          path: |
            Secret-Stories.deb
            Secret-Stories.AppImage

  # ==================================================================
  # 3. ANDROID PACKAGE (.apk)
  # ==================================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar APK para Android
        run: |
          flet build apk --product "Secret Stories" --icon "assets/logo.jpeg" --yes --no-rich-output

      - name: Subir artefacto Android (.apk)
        uses: actions/upload-artifact@v5
        with:
          name: Secret-Stories-Android-apk
          path: build/apk/*.apk
          