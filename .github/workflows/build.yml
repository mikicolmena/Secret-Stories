name: Build Secret Stories Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==================================================================
  # 1. WINDOWS EXECUTABLE (.exe)
  # ==================================================================
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar para Windows
        run: |
          echo y | flet build windows --verbose

      - name: Subir artefacto Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Stories-Windows-exe
          path: build/windows/

  # ==================================================================
  # 2. LINUX PACKAGES (.deb & .AppImage)
  # ==================================================================
  build-linux:
    name: Build Linux (.deb & .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar dependencias de compilación GTK/Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar binario de Linux
        run: |
          yes | flet build linux --verbose

      - name: Generar paquete .deb y .AppImage
        run: |
          # Paquete .deb
          mkdir -p deb_package/usr/bin deb_package/usr/share/secret-stories deb_package/DEBIAN
          cp -r build/linux/* deb_package/usr/share/secret-stories/
          ln -s /usr/share/secret-stories/main deb_package/usr/bin/secret-stories
          cat <<EOT > deb_package/DEBIAN/control
          Package: secret-stories
          Version: 1.0.0
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: mikicolmena
          Description: Secret Stories - Juego de misterio y acertijos
          EOT
          dpkg-deb --build deb_package Secret-Stories.deb

          # Paquete .AppImage
          wget https://github.com/AppImage/AppImageKit/releases/download/13/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin
          cp -r build/linux/* AppDir/usr/bin/
          cat <<EOT > AppDir/AppRun
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/main" "\$@"
          EOT
          chmod +x AppDir/AppRun
          cat <<EOT > AppDir/secret-stories.desktop
          [Desktop Entry]
          Name=Secret Stories
          Exec=main
          Icon=secret-stories
          Type=Application
          Categories=Game;
          EOT
          touch AppDir/secret-stories.png
          ./appimagetool-x86_64.AppImage AppDir Secret-Stories.AppImage

      - name: Subir artefactos Linux (.deb & .AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Stories-Linux-Packages
          path: |
            Secret-Stories.deb
            Secret-Stories.AppImage

  # ==================================================================
  # 3. ANDROID PACKAGE (.apk)
  # ==================================================================
  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Aceptar licencias Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-desktop

      - name: Compilar APK para Android
        run: |
          yes | flet build apk --verbose

      - name: Subir artefacto Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: Secret-Stories-Android-apk
          path: build/apk/*.apk
